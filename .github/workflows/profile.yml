name: Update contribution artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check reduced-motion transformation
        run: node scripts/reduced-motion.test.mjs
      - name: Generate artwork from actual contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=#0f766e
            assets/contributions-dark.svg?palette=github-dark&color_snake=#5eead4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Respect reduced motion
        run: node scripts/reduced-motion.mjs
      - name: Commit changed artwork as automation
        run: |
          git add assets/contributions.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution artwork is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh contribution artwork"
          git push origin HEAD:main
